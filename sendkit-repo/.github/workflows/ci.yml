name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint and Format Check
        run: |
          bun run format:check || true
          bun run lint || true

      - name: Build Packages
        run: |
          bun run build:core || true
          bun run build:cli || true
          bun run build:local-mcp || true
